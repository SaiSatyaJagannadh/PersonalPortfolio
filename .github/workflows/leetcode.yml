name: Refresh LeetCode stats

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths: ["scripts/update_leetcode.py", ".github/workflows/leetcode.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_leetcode.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/leetcode.json; then echo "No changes"; exit 0; fi
          git config user.name "leetcode-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leetcode.json
          git commit -m "chore: refresh LeetCode stats"
          git push
