name: Refresh GitHub activity

on:
  schedule:
    - cron: "43 9 * * *"    # daily, ~4:43am ET — picks up yesterday's pushes
    - cron: "43 23 * * *"   # and ~6:43pm ET for same-day pushes
  workflow_dispatch:
  push:
    paths: ["scripts/update_github.py", ".github/workflows/github-activity.yml"]

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet data/github.json && [ -z "$(git ls-files --others --exclude-standard data/github.json)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-activity-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git commit -m "chore: refresh GitHub activity"
          git pull --rebase origin main
          git push
